<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="hub-bg" x1="50" y1="30" x2="350" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hub-accent" x1="120" y1="120" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="hub-glow" x="100" y="80" width="200" height="140" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background panel -->
  <rect width="400" height="300" rx="16" fill="#f8fafc" />
  <circle cx="200" cy="150" r="120" fill="#e0f2fe" opacity="0.6" />

  <!-- Smart Hub Device Body -->
  <rect x="110" y="80" width="180" height="130" rx="28" fill="url(#hub-bg)" stroke="#334155" stroke-width="2" />
  <circle cx="200" cy="145" r="42" fill="none" stroke="url(#hub-accent)" stroke-width="4" stroke-dasharray="8 4" />
  <circle cx="200" cy="145" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

  <!-- Glowing Status Indicator -->
  <circle cx="200" cy="145" r="10" fill="#38bdf8" filter="url(#hub-glow)" />

  <!-- Ports & Antennas Graphic Elements -->
  <rect x="140" y="195" width="20" height="4" rx="2" fill="#64748b" />
  <rect x="170" y="195" width="20" height="4" rx="2" fill="#64748b" />
  <rect x="200" y="195" width="20" height="4" rx="2" fill="#38bdf8" />
  <rect x="230" y="195" width="20" height="4" rx="2" fill="#10b981" />

  <!-- Signal Waves -->
  <path d="M150 70 C 180 50, 220 50, 250 70" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M135 55 C 175 30, 225 30, 265 55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Model Tag -->
  <rect x="155" y="235" width="90" height="24" rx="6" fill="#0284c7" fill-opacity="0.1" />
  <text x="200" y="251" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">MATTER PRO X1</text>
</svg>
