<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="cam-lens" x1="160" y1="90" x2="240" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#f8fafc" />
  <circle cx="200" cy="145" r="110" fill="#f0f9ff" opacity="0.8" />

  <!-- Camera Stand & Mount -->
  <path d="M185 200 L180 230 H220 L215 200 Z" fill="#cbd5e1" />
  <rect x="160" y="225" width="80" height="8" rx="4" fill="#94a3b8" />

  <!-- Camera Body -->
  <circle cx="200" cy="135" r="65" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="200" cy="135" r="50" fill="#0f172a" />

  <!-- High Tech Lens -->
  <circle cx="200" cy="135" r="32" fill="url(#cam-lens)" />
  <circle cx="192" cy="125" r="7" fill="#ffffff" opacity="0.4" />
  <circle cx="200" cy="135" r="10" fill="#0284c7" opacity="0.8" />

  <!-- AI Bounding Box Reticle -->
  <path d="M145 90 H160 M145 90 V105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M255 90 H240 M255 90 V105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M145 180 H160 M145 180 V165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <path d="M255 180 H240 M255 180 V165" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Status LED -->
  <circle cx="200" cy="80" r="3" fill="#10b981" />
  <circle cx="200" cy="80" r="6" fill="#10b981" opacity="0.25" />

  <!-- Model Tag -->
  <rect x="145" y="245" width="110" height="24" rx="6" fill="#0284c7" fill-opacity="0.1" />
  <text x="200" y="261" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">VISION AI 4K</text>
</svg>
