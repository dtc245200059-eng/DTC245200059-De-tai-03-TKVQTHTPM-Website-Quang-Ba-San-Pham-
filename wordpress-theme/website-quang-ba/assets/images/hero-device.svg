<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" fill="none">
  <defs>
    <linearGradient id="hero-grad-main" x1="50" y1="50" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="hero-cyan-glow" x1="150" y1="100" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="hero-glow-fx" x="0" y="0" width="540" height="420" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="270" cy="210" r="160" fill="#0284c7" opacity="0.15" filter="url(#hero-glow-fx)" />
  <circle cx="380" cy="140" r="90" fill="#38bdf8" opacity="0.2" filter="url(#hero-glow-fx)" />

  <!-- Main Showcase Terminal / Hub Mockup -->
  <rect x="70" y="60" width="400" height="280" rx="24" fill="url(#hero-grad-main)" stroke="#334155" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="70" y="60" width="400" height="40" rx="24" fill="#1e293b" />
  <rect x="70" y="85" width="400" height="15" fill="#1e293b" />
  <circle cx="95" cy="80" r="5" fill="#ef4444" />
  <circle cx="112" cy="80" r="5" fill="#f59e0b" />
  <circle cx="129" cy="80" r="5" fill="#10b981" />
  <text x="270" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">TechSmart OS — Bảng Điều Khiển Thiết Bị IoT</text>

  <!-- Central Device Mesh Visual -->
  <circle cx="270" cy="190" r="60" fill="none" stroke="url(#hero-cyan-glow)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="270" cy="190" r="42" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
  <path d="M260 178L270 196L280 178" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="270" cy="188" r="3" fill="#ffffff" />

  <!-- Orbiting Nodes -->
  <g>
    <!-- Node 1: Sensor -->
    <line x1="270" y1="190" x2="160" y2="150" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="160" cy="150" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="154" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">24°C</text>
  </g>
  <g>
    <!-- Node 2: Camera AI -->
    <line x1="270" y1="190" x2="380" y2="150" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="380" cy="150" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="380" cy="150" r="6" fill="#10b981" />
  </g>
  <g>
    <!-- Node 3: Gateway -->
    <line x1="270" y1="190" x2="210" y2="260" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="210" cy="260" r="20" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <text x="210" y="264" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#a5b4fc" text-anchor="middle">VPN</text>
  </g>
  <g>
    <!-- Node 4: Power UPS -->
    <line x1="270" y1="190" x2="330" y2="260" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="330" cy="260" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="330" y="264" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">100%</text>
  </g>

  <!-- Live Status Floating Card (Glassmorphic) -->
  <rect x="325" y="270" width="180" height="70" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="350" cy="305" r="14" fill="#10b981" fill-opacity="0.2" />
  <circle cx="350" cy="305" r="6" fill="#10b981" />
  <text x="372" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Trạng Thái Demo</text>
  <text x="372" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Mô phỏng thiết bị IoT</text>

  <!-- Performance Badge (Glassmorphic) -->
  <rect x="35" y="250" width="160" height="64" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.5" />
  <text x="55" y="276" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#38bdf8">Telemetry</text>
  <text x="55" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Giám Sát Prometheus</text>
</svg>
