<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="tag-bg" x1="120" y1="80" x2="280" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#f8fafc" />
  <circle cx="200" cy="145" r="110" fill="#f1f5f9" opacity="0.8" />

  <!-- Location Pulse Rings -->
  <circle cx="200" cy="140" r="75" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="200" cy="140" r="95" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 8" opacity="0.4" />

  <!-- SmartTag Body -->
  <circle cx="200" cy="140" r="50" fill="url(#tag-bg)" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="200" cy="140" r="42" fill="#ffffff" />

  <!-- Center Logo / Speaker Holes -->
  <circle cx="200" cy="130" r="10" fill="#0284c7" />
  <path d="M197 127L203 133M203 127L197 133" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Sound/Precision Pin -->
  <path d="M200 148 C194 148, 190 152, 190 156 C190 162, 200 170, 200 170 C200 170, 210 162, 210 156 C210 152, 206 148, 200 148 Z" fill="#ef4444" />
  <circle cx="200" cy="154" r="2.5" fill="#ffffff" />

  <!-- Keychain Hole -->
  <circle cx="200" cy="100" r="6" fill="#94a3b8" />

  <!-- Model Tag -->
  <rect x="145" y="235" width="110" height="24" rx="6" fill="#0284c7" fill-opacity="0.1" />
  <text x="200" y="251" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">SMARTTAG R2</text>
</svg>
