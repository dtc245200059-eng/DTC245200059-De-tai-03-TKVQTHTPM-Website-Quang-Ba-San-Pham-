<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="ups-body" x1="100" y1="80" x2="300" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ups-screen" x1="150" y1="120" x2="250" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#f8fafc" />
  <circle cx="200" cy="150" r="115" fill="#fef3c7" opacity="0.5" />

  <!-- UPS Main Body -->
  <rect x="110" y="85" width="180" height="130" rx="20" fill="url(#ups-body)" stroke="#475569" stroke-width="2" />

  <!-- Digital Screen -->
  <rect x="145" y="115" width="110" height="45" rx="8" fill="url(#ups-screen)" stroke="#059669" stroke-width="1.5" />
  <text x="175" y="142" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#34d399">12.0V</text>
  <text x="235" y="142" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#10b981">98%</text>

  <!-- Battery Icon on screen -->
  <rect x="155" y="132" width="12" height="8" rx="1.5" fill="none" stroke="#34d399" stroke-width="1" />
  <rect x="156.5" y="133.5" width="7" height="5" rx="0.5" fill="#34d399" />
  <line x1="168" y1="135" x2="168" y2="137" stroke="#34d399" stroke-width="1" />

  <!-- Power Button & Ports -->
  <circle cx="150" cy="185" r="10" fill="#334155" stroke="#64748b" stroke-width="1" />
  <circle cx="150" cy="185" r="5" fill="#10b981" />
  <rect x="180" y="180" width="18" height="10" rx="2" fill="#0284c7" />
  <rect x="210" y="180" width="18" height="10" rx="2" fill="#0284c7" />
  <circle cx="250" cy="185" r="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />

  <!-- Power Lightning Graphic -->
  <path d="M200 65 L190 85 H200 L195 105 L215 80 H205 L212 65 Z" fill="#f59e0b" opacity="0.85" />

  <!-- Model Tag -->
  <rect x="145" y="235" width="110" height="24" rx="6" fill="#f59e0b" fill-opacity="0.1" />
  <text x="200" y="251" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">POWERGUARD UPS</text>
</svg>
