# ==============================================================================
# HAPROXY CONFIGURATION - DOCKER SOCKET API ALLOWLIST PROXY (haproxy.cfg)
# Đề tài số 03: Website Quảng bá Sản phẩm bằng WordPress
# Môn học: Triển khai và Quản trị Hệ thống Phần mềm
# Sinh viên: Nông Quốc Tuấn | MSV: DTC245200059 | Lớp: KTPM K23C
#
# Kiến trúc bảo mật: Strict Allowlist (Chính sách Deny-by-default)
# Khắc phục triệt để lỗ hổng CVE-2026-78122 (Issue #182 trên docker-socket-proxy)
# ==============================================================================

global
    maxconn 256
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend docker_api_in
    bind *:2375
    mode http

    # 1. Chỉ chấp nhận các phương thức HTTP an toàn (GET và HEAD)
    # Ngăn chặn tuyệt đối mọi hành vi sửa đổi trạng thái: POST, PUT, DELETE, PATCH
    acl is_safe_method method GET HEAD
    http-request deny deny_status 403 if !is_safe_method

    # 2. Định nghĩa danh sách các Endpoint được phép (Allowlist) phục vụ Alloy & Healthcheck:
    # - Ping kiểm tra tình trạng daemon và phục vụ healthcheck
    acl is_ping              path -m reg -i ^(/v[0-9\.]+)?/_ping$
    # - Tra cứu phiên bản Docker API phục vụ handshake ban đầu
    acl is_version           path -m reg -i ^(/v[0-9\.]+)?/version$
    # - Liệt kê containers và labels cho discovery.docker (ContainerList)
    acl is_containers_list   path -m reg -i ^(/v[0-9\.]+)?/containers/json$
    # - Truy vấn trạng thái container phục vụ loki.source.docker tailer (ContainerInspect)
    acl is_container_inspect path -m reg -i ^(/v[0-9\.]+)?/containers/[a-zA-Z0-9_.-]+/json$
    # - Thu thập luồng log stdout/stderr của container (ContainerLogs)
    acl is_container_logs    path -m reg -i ^(/v[0-9\.]+)?/containers/[a-zA-Z0-9_.-]+/logs$

    # 3. Cho phép các request thỏa mãn Allowlist
    http-request allow if is_ping
    http-request allow if is_version
    http-request allow if is_containers_list
    http-request allow if is_container_inspect
    http-request allow if is_container_logs

    # 4. CHẶN TOÀN BỘ CÁC ĐƯỜNG DẪN CÒN LẠI (DENY-BY-DEFAULT):
    # - Chặn GET /events (Alloy discovery dùng polling qua refresh_interval, không cần event stream)
    # - Chặn tuyệt đối GET /containers/{id}/archive (chống đọc trộm file trên container - CVE-2026-78122)
    # - Chặn tuyệt đối GET /containers/{id}/export (chống tải dump toàn bộ filesystem container)
    # - Chặn tuyệt đối GET /containers/{id}/attach (chống chiếm terminal websocket)
    # - Chặn tuyệt đối GET /containers/{id}/top (chống theo dõi tiến trình nội bộ)
    # - Chặn toàn bộ các namespace quản trị: /exec, /images, /volumes, /networks, /build, /swarm...
    http-request deny deny_status 403

    default_backend docker_socket_backend

backend docker_socket_backend
    mode http
    server docker_daemon unix@/var/run/docker.sock
