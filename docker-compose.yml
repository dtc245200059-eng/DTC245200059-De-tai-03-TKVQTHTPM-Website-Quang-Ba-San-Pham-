# ==============================================================================
# DOCKER COMPOSE - GIAI ĐOẠN 3: NGINX REVERSE PROXY, HTTPS & SECURITY HEADERS
# Đề tài số 03: Website Quảng bá Sản phẩm bằng WordPress
# Môn học: Triển khai và Quản trị Hệ thống Phần mềm
# Sinh viên: Nông Quốc Tuấn | MSV: DTC245200059 | Lớp: KTPM K23C
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # DỊCH VỤ 1: ĐIỂM TRUY CẬP DUY NHẤT - NGINX REVERSE PROXY & HTTPS ENTRY POINT
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.30.6-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - frontend-net
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:443/ || wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # DỊCH VỤ 2: ỨNG DỤNG WEBSITE QUẢNG BÁ SẢN PHẨM (WORDPRESS)
  # ----------------------------------------------------------------------------
  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      # Nhận diện chính xác giao thức HTTPS từ Nginx Reverse Proxy (Chống vòng lặp redirect)
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/wp-admin/install.php || curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # DỊCH VỤ 3: CÔNG CỤ QUẢN TRỊ CƠ SỞ DỮ LIỆU PHPMYADMIN
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: ${PMA_ARBITRARY:-0}
      UPLOAD_LIMIT: 64M
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # DỊCH VỤ 4: HỆ QUẢN TRỊ CƠ SỞ DỮ LIỆU MYSQL
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ------------------------------------------------------------------------------
# KHAI BÁO PHÂN TÁCH MẠNG NỘI BỘ (NETWORK ISOLATION)
# ------------------------------------------------------------------------------
networks:
  frontend-net:
    driver: bridge

  # Mạng nội bộ lưu chuyển dữ liệu CSDL
  backend-net:
    driver: bridge
    internal: true

# ------------------------------------------------------------------------------
# KHAI BÁO LƯU TRỮ BỀN VỮNG (PERSISTENT VOLUMES)
# ------------------------------------------------------------------------------
volumes:
  # Lưu trữ mã nguồn, uploads, themes, plugins của WordPress
  wordpress_data:
    driver: local
  # Lưu trữ bảng CSDL MySQL (Không bị mất dữ liệu khi container recreate)
  db_data:
    driver: local
