# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY & SECURITY CONFIGURATION
# Đề tài số 03: Website Quảng bá Sản phẩm bằng WordPress
# Môn học: Triển khai và Quản trị Hệ thống Phần mềm
# Sinh viên: Nông Quốc Tuấn | MSV: DTC245200059 | Lớp: KTPM K23C
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng nhật ký chi tiết bao gồm địa chỉ IP thực tế và thời gian phản hồi
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Tối ưu hóa truyền tải dữ liệu
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # BẢO MẬT: Ẩn thông tin phiên bản Nginx để hạn chế lộ diện thông tin (OSINT)
    server_tokens off;

    # Giới hạn kích thước gói tin tải lên (Khớp với cấu hình WordPress upload và phpMyAdmin)
    client_max_body_size 64M;

    # Cấu hình timeouts đọc dữ liệu (Giảm thiểu thời gian chiếm giữ kết nối nhàn rỗi)
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;

    # Cấu hình bộ đệm xử lý gói tin yêu cầu
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # Khai báo vùng nhớ rate limiting cho đăng nhập WordPress (chống brute-force)
    limit_req_zone $binary_remote_addr zone=wp_login:10m rate=5r/s;
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # THIẾT LẬP CHUẨN MÃ HÓA SSL/TLS
    # --------------------------------------------------------------------------
    # Chỉ cho phép TLS 1.2 và TLS 1.3 hiện đại (Vô hiệu hóa hoàn toàn SSLv3, TLS 1.0, TLS 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Bộ nhớ đệm phiên SSL (Tối ưu hiệu năng giải mã bắt tay TLS)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # HTTP SECURITY HEADERS (ÁP DỤNG TOÀN CỤC)
    # --------------------------------------------------------------------------
    # 1. Chống kỹ thuật MIME-sniffing: Ép trình duyệt tuân thủ Content-Type máy chủ khai báo
    add_header X-Content-Type-Options "nosniff" always;

    # 2. Chống tấn công Clickjacking: Chỉ cho phép hiển thị trong iframe cùng domain
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 3. Kiểm soát thông tin đường dẫn giới thiệu khi chuyển hướng liên kết
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 4. Giới hạn các tính năng phần cứng nhạy cảm (camera, micro, định vị)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 5. Header XSS di sản: Được giữ lại nhằm đáp ứng tiêu chí đánh giá của đề bài.
    #    LƯU Ý: Header này đã lỗi thời trên trình duyệt hiện đại và KHÔNG được coi là biện pháp bảo vệ XSS chính.
    add_header X-XSS-Protection "1; mode=block" always;

    # 6. Content Security Policy (Chế độ Report-Only):
    #    LƯU Ý KỸ THUẬT: Đặt ở chế độ Report-Only để không chặn nhầm script, style, block editor của WordPress.
    #    Hiện tại chưa cấu hình endpoint nhận báo cáo tập trung (report-uri/report-to); các cảnh báo vi phạm
    #    chỉ xuất hiện trong Developer Console của trình duyệt phục vụ kiểm tra chẩn đoán.
    add_header Content-Security-Policy-Report-Only "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;" always;

    # LƯU Ý VỀ HSTS (Strict-Transport-Security):
    # Tuyệt đối KHÔNG cấu hình HSTS trong môi trường demo sử dụng chứng chỉ tự ký (Self-Signed)
    # để tránh trình duyệt khóa cố định vĩnh viễn tên miền demo.

    # --------------------------------------------------------------------------
    # CẤU HÌNH THÔNG SỐ CHUYỂN TIẾP PROXY (PROXY FORWARDING SETTINGS)
    # --------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https; # Thông báo cho WordPress biết kết nối ngoài là HTTPS
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_connect_timeout 90s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # ==========================================================================
    # KHỐI 1: MÁY CHỦ MẶC ĐỊNH (DEFAULT CATCH-ALL SERVER) - CHỐNG HOST HEADER INJECTION
    # ==========================================================================
    # Bắt tất cả các truy vấn có Host header không hợp lệ / không nằm trong danh sách cho phép.
    # Ngăn chặn Open Redirect và chặn quét cổng IP trực tiếp từ Internet.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        # Từ chối lập tức kết nối, không trả dữ liệu và không chuyển hướng (HTTP 444)
        return 444;
    }

    # ==========================================================================
    # KHỐI 2: CHUYỂN HƯỚNG HTTP 80 -> HTTPS 443 CHO TỪNG HOSTNAME ĐƯỢC PHÉP
    # ==========================================================================
    # 2.1. Chuyển hướng cho WordPress (shop.local) - Đích redirect tường minh, chống Open Redirect
    server {
        listen 80;
        listen [::]:80;
        server_name shop.local;
        return 301 https://shop.local$request_uri;
    }

    # 2.2. Chuyển hướng cho phpMyAdmin (pma.shop.local) - Đích redirect tường minh
    server {
        listen 80;
        listen [::]:80;
        server_name pma.shop.local;
        return 301 https://pma.shop.local$request_uri;
    }

    # 2.3. Chuyển hướng cho truy cập cục bộ (localhost & 127.0.0.1)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost 127.0.0.1;
        return 301 https://localhost$request_uri;
    }

    # ==========================================================================
    # KHỐI 3: HTTPS (CỔNG 443) -> WORDPRESS (shop.local)
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name shop.local;

        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        location / {
            proxy_pass http://wordpress:80;
        }

        # Giới hạn tốc độ truy cập trang đăng nhập WordPress (Chống Brute-Force)
        location = /wp-login.php {
            limit_req zone=wp_login burst=10 nodelay;
            proxy_pass http://wordpress:80;
        }

        # Vô hiệu hóa giao thức XML-RPC (Chống Pingback Reflection DDoS & Multicall Brute-force)
        location = /xmlrpc.php {
            deny all;
            return 403;
        }

        # Chặn truy cập trực tiếp các tệp ẩn hệ thống (.git, .env...)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==========================================================================
    # KHỐI 4: HTTPS (CỔNG 443) -> WORDPRESS (localhost / 127.0.0.1 - Phục vụ Demo nhanh)
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        location / {
            proxy_pass http://wordpress:80;
        }

        # Giới hạn tốc độ truy cập trang đăng nhập WordPress (Chống Brute-Force)
        location = /wp-login.php {
            limit_req zone=wp_login burst=10 nodelay;
            proxy_pass http://wordpress:80;
        }

        # Vô hiệu hóa giao thức XML-RPC (Chống Pingback Reflection DDoS & Multicall Brute-force)
        location = /xmlrpc.php {
            deny all;
            return 403;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==========================================================================
    # KHỐI 5: HTTPS (CỔNG 443) -> PHPMYADMIN (pma.shop.local)
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name pma.shop.local;

        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        # LỚP BẢO VỆ RIÊNG: Xác thực HTTP Basic Auth cấp máy chủ Nginx (Chỉ áp dụng cho phpMyAdmin)
        auth_basic "Khu vuc Quan tri Database - Yeu cau xac thuc";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://phpmyadmin:80;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
